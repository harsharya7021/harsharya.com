# Tell Bing (and every other IndexNow engine — Yandex, Seznam, Naver, Yep)
# about pages the moment they change, instead of waiting for a crawl.
# ChatGPT search leans on Bing's index, so this is how new pages reach it fast.
#
# On each push to main: waits until GitHub Pages is serving the new files,
# then submits the URLs of the pages that changed. If the sitemap or this file
# changed (or you run it by hand from the Actions tab), it submits every URL
# in sitemap.xml. The key is public by design: it is the file at
# https://harsharya.com/a8b71d60bbde4aa723b32d3e4ade0b25.txt
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: harsharya.com
      KEY: a8b71d60bbde4aa723b32d3e4ade0b25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Work out which URLs changed
        id: urls
        run: |
          all_urls() { grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##'; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse -q --verify HEAD~1 >/dev/null; then
            all_urls > urls.txt
          else
            changed=$(git diff --name-only HEAD~1 HEAD)
            if echo "$changed" | grep -qE '^(sitemap\.xml|\.github/workflows/indexnow\.yml)$'; then
              all_urls > urls.txt
            else
              echo "$changed" \
                | grep -E '\.html$' \
                | grep -vE '^(writing/editor\.html|manage\.html|speakeasy/|onlyfans/|stack/|consult/|_)' \
                | sed -e 's#index\.html$##' -e "s#^#https://$HOST/#" > urls.txt || true
            fi
          fi
          # only ever submit URLs that are in the sitemap (i.e. meant to be indexed)
          all_urls > sitemap-urls.txt
          grep -Fxf sitemap-urls.txt urls.txt > submit.txt || true
          echo "count=$(wc -l < submit.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "URLs to submit:"; cat submit.txt

      - name: Wait until the live site serves this commit
        if: steps.urls.outputs.count != '0'
        run: |
          # Fetch each URL (cache-busted) until its bytes match the file in this
          # commit, so search engines are only pinged once the new page is live.
          python3 - <<'PY'
          import hashlib, os, time, urllib.request
          host = os.environ["HOST"]
          urls = [u.strip() for u in open("submit.txt") if u.strip()]
          def path_for(u):
              p = u.split(host, 1)[1].lstrip("/")
              return p + "index.html" if (p == "" or p.endswith("/")) else p
          pending = {u: path_for(u) for u in urls}
          deadline = time.time() + 480
          while pending and time.time() < deadline:
              for u, p in list(pending.items()):
                  try:
                      req = urllib.request.Request(f"{u}?cb={int(time.time())}", headers={"Cache-Control": "no-cache"})
                      live = urllib.request.urlopen(req, timeout=20).read()
                      if hashlib.sha256(live).digest() == hashlib.sha256(open(p, "rb").read()).digest():
                          del pending[u]
                  except Exception:
                      pass
              if pending:
                  time.sleep(15)
          ok = len(urls) - len(pending)
          stale = f"; still stale: {', '.join(list(pending)[:5])}" if pending else ""
          print(f"::notice title=Live check::{ok}/{len(urls)} pages serve this commit{stale}")
          PY

      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          host, key = os.environ["HOST"], os.environ["KEY"]
          urls = [u.strip() for u in open("submit.txt") if u.strip()]
          body = json.dumps({"host": host, "key": key,
                             "keyLocation": f"https://{host}/{key}.txt",
                             "urlList": urls}).encode()
          accepted = 0
          for endpoint in ("https://api.indexnow.org/indexnow", "https://www.bing.com/indexnow"):
              req = urllib.request.Request(endpoint, data=body, method="POST",
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      code, detail = r.status, ""
              except urllib.error.HTTPError as e:
                  code, detail = e.code, e.read()[:200].decode("utf-8", "replace")
              except Exception as e:
                  code, detail = 0, str(e)[:200]
              # 200 = submitted, 202 = received (key check pending). Shown as an
              # annotation on the run so it's visible without opening the logs.
              ok = code in (200, 202)
              accepted += ok
              level = "notice" if ok else "warning"
              print(f"::{level} title=IndexNow::{endpoint} -> HTTP {code} for {len(urls)} URLs {detail}".strip())
          if not accepted:
              raise SystemExit("No IndexNow endpoint accepted the submission")
          PY
